name: World Tick

# Il battito del mondo di MFoot.
#
# Fa avanzare il gioco anche quando nessuno sta giocando: simula le partite in orario,
# chiude le aste scadute, fa scadere contratti e prestiti, sveglia le squadre AI.
#
# Il cron di GitHub non e' puntuale e ogni tanto salta un giro: non e' un problema.
# Il tick non chiede "cosa succede adesso" ma "cosa sarebbe dovuto succedere fra
# l'ultimo giro e adesso", quindi recupera da solo gli intervalli persi.

on:
  schedule:
    # Ogni 10 minuti, non ogni 5.
    #
    # Cinque e' il minimo che GitHub consente, ed era la scelta ovvia. Misurato pero' sul
    # registro delle esecuzioni: un giro dura circa **otto minuti** — un minuto di build e
    # sette di elaborazione — quindi con il cron a cinque i giri si accavallano sempre.
    # Con `concurrency` il secondo si mette in coda e il terzo lo annulla: un terzo delle
    # esecuzioni risultava "cancelled" senza che nessuno ne capisse il motivo.
    #
    # Dieci non rallenta il gioco: GitHub ritarda comunque i lavori pianificati, e la
    # cadenza vera misurata era gia' fra i trenta e i cinquanta minuti. Dieci descrive la
    # realta' invece di fingere una precisione che non c'e', e smette di produrre
    # annullamenti che sembrano guasti.
    - cron: '*/10 * * * *'
  # Permette di lanciarlo a mano dalla tab Actions, utile per provare.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Calcola il piano senza scrivere niente"
        type: boolean
        default: false

# Due tick in parallelo scriverebbero sugli stessi dati. Meglio saltarne uno che
# rischiare una corsa critica: quello dopo recupera comunque.
concurrency:
  group: world-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Rete di sicurezza: il repository viene aggiornato da Windows, dove il permesso
      # di esecuzione non esiste. Se si perde di nuovo, qui non se ne accorge nessuno.
      - name: Rendi eseguibile il wrapper
        run: chmod +x ./gradlew

      - name: Costruisci il tick
        run: ./gradlew :tick:fatJar --no-daemon

      - name: Esegui il tick
        env:
          MFOOT_DB_URL: ${{ secrets.MFOOT_DB_URL }}
          MFOOT_DB_USER: ${{ secrets.MFOOT_DB_USER }}
          MFOOT_DB_PASSWORD: ${{ secrets.MFOOT_DB_PASSWORD }}
          MFOOT_TELEGRAM_TOKEN: ${{ secrets.MFOOT_TELEGRAM_TOKEN }}
          MFOOT_TELEGRAM_CHAT: ${{ secrets.MFOOT_TELEGRAM_CHAT }}
          MFOOT_DRY_RUN: ${{ inputs.dry_run }}
        run: java -jar tick/build/dist/world-tick.jar
