name: World Tick

# Il battito del mondo di MFoot.
#
# Fa avanzare il gioco anche quando nessuno sta giocando: simula le partite in orario,
# chiude le aste scadute, fa scadere contratti e prestiti, sveglia le squadre AI.
#
# Il tick non chiede "cosa succede adesso" ma "cosa sarebbe dovuto succedere fra l'ultimo
# giro e adesso", quindi recupera da solo gli intervalli persi.

on:
  # LA SVEGLIA VERA ARRIVA DA SUPABASE
  #
  # Misurato il 2026-08-25 sugli ultimi quattordici giri, minuti fra un avvio e il
  # successivo: 34 22 51 50 47 53 44 44 31 29 32 73 2.
  #
  # Il cron qui sotto chiede un giro ogni dieci minuti. GitHub ne consegna uno ogni
  # **trentanove**: sul piano gratuito i lavori pianificati vengono ritardati o saltati, e
  # non c'e' niente nel progetto che possa influenzarlo.
  #
  # Per questo l'orologio vero sta dentro il database — `pg_cron` chiama qui ogni cinque
  # minuti, vedi `sveglia_il_tick()` in `supabase/schema.sql`. Il cron di GitHub resta
  # acceso come **rete di sicurezza**: se il database non riesce a chiamare (token scaduto,
  # estensione disattivata) il mondo torna lento invece di fermarsi.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Calcola il piano senza scrivere niente"
        type: boolean
        default: false

  schedule:
    - cron: '*/10 * * * *'

  # E appena il codice nuovo e' costruito, si gira subito con quello: cosi' non esiste una
  # finestra in cui il server esegue la versione precedente.
  workflow_run:
    workflows: ["Costruisci il tick"]
    types: [completed]

# Due tick in parallelo scriverebbero sugli stessi dati. Meglio saltarne uno che rischiare
# una corsa critica: quello dopo recupera comunque.
concurrency:
  group: world-tick
  cancel-in-progress: false

permissions:
  contents: read
  # Serve per farsi riconoscere da Google **senza chiavi**: GitHub firma un gettone che
  # dimostra «sono questo repository, in esecuzione su questo workflow», e Google lo
  # scambia con un permesso che dura un'ora.
  #
  # E' la strada che Google impone sui progetti nuovi, dove il pulsante «genera chiave
  # privata» risponde «non consentito». Non e' un ripiego: una chiave privata dentro un
  # file e' un segreto che non scade mai e che nessuno si accorge se esce.
  id-token: write

jobs:
  tick:
    runs-on: ubuntu-latest

    # Non girare dopo una costruzione fallita: eseguirebbe il jar precedente, che e' quello
    # che gia' gira, quindi sarebbe solo un giro in piu' senza motivo.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    # VENTI MINUTI, E PERCHE' DIECI ERANO UN DIFETTO GRAVE
    #
    # Misurato il 2026-08-25: su venti esecuzioni consecutive, **tredici** finivano
    # `cancelled` a dieci minuti e venti secondi esatti. Non era GitHub che annullava per
    # concorrenza, era questo cronometro che uccideva il processo — e il processo ucciso
    # non lasciava niente, perche' il tick fa `commit` solo alla fine di ogni lega.
    #
    # Il tetto vero e' MFOOT_BUDGET_SECONDS piu' sotto, che e' piu' basso: il tick si ferma
    # da solo **prima**, chiude la transazione e salva. I due numeri vanno tenuti insieme,
    # e per questo stanno nello stesso file.
    timeout-minutes: 20

    steps:
      # Serve solo al ripiego: se lo scaricamento fallisce, si costruisce da sorgente.
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # IL JAR SI SCARICA, NON SI COSTRUISCE
      #
      # Costruirlo costava cinquantanove secondi misurati, a ogni giro, per riprodurre un
      # file identico a quello del giro prima. Lo costruisce `build-tick.yml` una volta,
      # quando il codice cambia, e qui si scarica in due o tre secondi.
      - name: Scarica il tick gia' costruito
        id: scarica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          if gh release download tick-latest --pattern world-tick.jar --dir dist; then
            echo "pronto=si" >> "$GITHUB_OUTPUT"
            ls -la dist/
          else
            echo "pronto=no" >> "$GITHUB_OUTPUT"
            echo "Nessun jar pubblicato: lo costruisco da sorgente."
          fi

      # Il ripiego. Un minuto in piu' e' incomparabilmente meglio di un giro saltato: senza
      # questo, un problema nella pubblicazione fermerebbe il mondo invece di rallentarlo.
      - name: Costruisci da sorgente, se necessario
        if: steps.scarica.outputs.pronto == 'no'
        run: |
          chmod +x ./gradlew
          ./gradlew :tick:fatJar --no-daemon
          cp tick/build/dist/world-tick.jar dist/

      # IL PERMESSO PER FIREBASE, SENZA NESSUNA CHIAVE
      #
      # `continue-on-error` non e' pigrizia: se la federazione non e' configurata, o se un
      # giorno smette di funzionare, il mondo deve continuare a girare **senza le
      # notifiche** invece di fermarsi. Il tick lo dice all'avvio: «NOTIFICHE SPENTE».
      - name: Fatti riconoscere da Google
        id: google
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          project_id: mfoot-aaa
          workload_identity_provider: projects/595628748169/locations/global/workloadIdentityPools/github/providers/github
          service_account: firebase-adminsdk-fbsvc@mfoot-aaa.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging

      - name: Esegui il tick
        env:
          MFOOT_DB_URL: ${{ secrets.MFOOT_DB_URL }}
          MFOOT_DB_USER: ${{ secrets.MFOOT_DB_USER }}
          MFOOT_DB_PASSWORD: ${{ secrets.MFOOT_DB_PASSWORD }}
          MFOOT_TELEGRAM_TOKEN: ${{ secrets.MFOOT_TELEGRAM_TOKEN }}
          MFOOT_TELEGRAM_CHAT: ${{ secrets.MFOOT_TELEGRAM_CHAT }}
          # Le notifiche sul telefono, per la strada senza chiavi: il permesso lo ha
          # appena ottenuto il passo qui sopra e dura un'ora, quindi non e' un segreto da
          # custodire — e' gia' scaduto prima che serva a qualcuno.
          MFOOT_FCM_TOKEN: ${{ steps.google.outputs.access_token }}
          MFOOT_FCM_PROJECT: mfoot-aaa
          # La strada con la chiave resta possibile, per chi ha un progetto Google dove
          # generarne una e' ancora permesso. Se c'e', vince questa.
          MFOOT_FCM_KEY: ${{ secrets.MFOOT_FCM_KEY }}
          MFOOT_DRY_RUN: ${{ inputs.dry_run }}
          # Nove minuti contro i venti di timeout-minutes. Il margine copre lo
          # scaricamento, l'avvio della JVM e — nel caso peggiore — il ripiego che
          # costruisce da sorgente.
          MFOOT_BUDGET_SECONDS: '540'
        run: java -jar dist/world-tick.jar
