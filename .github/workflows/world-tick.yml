name: World Tick

# Il battito del mondo di MFoot.
#
# Fa avanzare il gioco anche quando nessuno sta giocando: simula le partite in orario,
# chiude le aste scadute, fa scadere contratti e prestiti, sveglia le squadre AI.
#
# Il cron di GitHub non e' puntuale e ogni tanto salta un giro: non e' un problema.
# Il tick non chiede "cosa succede adesso" ma "cosa sarebbe dovuto succedere fra
# l'ultimo giro e adesso", quindi recupera da solo gli intervalli persi.

on:
  schedule:
    # Ogni 10 minuti.
    #
    # GitHub ritarda comunque i lavori pianificati sul piano gratuito: la cadenza vera
    # misurata sul registro delle esecuzioni sta fra i trenta e i cinquanta minuti. Dieci
    # descrive l'intenzione senza fingere una precisione che non c'e'.
    - cron: '*/10 * * * *'
  # Permette di lanciarlo a mano dalla tab Actions, utile per provare.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Calcola il piano senza scrivere niente"
        type: boolean
        default: false

# Due tick in parallelo scriverebbero sugli stessi dati. Meglio saltarne uno che
# rischiare una corsa critica: quello dopo recupera comunque.
concurrency:
  group: world-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest

    # VENTI MINUTI, E IL MOTIVO PER CUI DIECI ERANO UN DIFETTO GRAVE
    #
    # Misurato il 2026-08-25 sulle ultime venti esecuzioni: **tredici** finivano
    # `cancelled` a dieci minuti e venti secondi esatti dall'avvio. Non era GitHub che
    # annullava per concorrenza — era questo cronometro che uccideva il processo.
    #
    # E il processo ucciso non lasciava niente. Il tick elabora una lega per transazione e
    # fa `commit` solo alla fine: staccare la spina a meta' significa che Postgres annulla
    # tutto. Partite simulate, acquisti delle AI, stipendi, colloqui — tutto indietro.
    #
    # E' la spiegazione di «le AI comprano una volta al giorno»: non erano lente, due volte
    # su tre il loro acquisto veniva cancellato da questo numero.
    #
    # Venti minuti e' il tetto duro. Il tetto vero e' MFOOT_BUDGET_SECONDS qui sotto, che
    # e' piu' basso: il tick si ferma da solo **prima**, chiude la transazione e salva.
    # I due numeri vanno tenuti insieme, e per questo stanno nello stesso file.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Il tick non cambia a ogni giro, quindi non c'e' niente di nuovo da salvare in
          # cache: il passo "Post Gradle" ci metteva ventisei secondi a riscrivere quello
          # che c'era gia'. In sola lettura la cache si usa e non si riscrive.
          #
          # Quando il codice del tick cambia davvero, il primo giro dopo il push ricostruisce
          # da capo e ci mette qualche secondo in piu': una volta, non a ogni giro.
          cache-read-only: true

      # Rete di sicurezza: il repository viene aggiornato da Windows, dove il permesso
      # di esecuzione non esiste. Se si perde di nuovo, qui non se ne accorge nessuno.
      - name: Rendi eseguibile il wrapper
        run: chmod +x ./gradlew

      - name: Costruisci il tick
        run: ./gradlew :tick:fatJar --no-daemon

      - name: Esegui il tick
        env:
          MFOOT_DB_URL: ${{ secrets.MFOOT_DB_URL }}
          MFOOT_DB_USER: ${{ secrets.MFOOT_DB_USER }}
          MFOOT_DB_PASSWORD: ${{ secrets.MFOOT_DB_PASSWORD }}
          MFOOT_TELEGRAM_TOKEN: ${{ secrets.MFOOT_TELEGRAM_TOKEN }}
          MFOOT_TELEGRAM_CHAT: ${{ secrets.MFOOT_TELEGRAM_CHAT }}
          MFOOT_DRY_RUN: ${{ inputs.dry_run }}
          # Quindici minuti contro i venti di timeout-minutes. Nei cinque di scarto ci
          # stanno la costruzione del jar (che avviene prima che il cronometro parta) e il
          # margine perche' il tick decida di fermarsi invece di essere ammazzato.
          MFOOT_BUDGET_SECONDS: '900'
        run: java -jar tick/build/dist/world-tick.jar
