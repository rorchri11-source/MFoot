# Quanta memoria ha la macchina virtuale che compila.
#
# ## Perche' questo file e' nato il 2026-08-26
#
# Perche' senza, la costruzione del rilascio falliva cosi':
#
#     ERROR: D8: java.lang.OutOfMemoryError: Metaspace
#
# D8 e' il passo che trasforma i `.class` in bytecode per Android, e la Metaspace e' dove
# la macchina virtuale tiene le **definizioni** delle classi — non gli oggetti. Finche' il
# progetto aveva Compose e poco altro il valore predefinito bastava; con Firebase Cloud
# Messaging e le sue dipendenze le classi da caricare in un colpo sono diventate troppe.
#
# Il sintomo inganna: sembra un difetto dello strumento, e invece e' semplicemente un
# tetto raggiunto. La correzione e' alzarlo.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# I moduli `core`, `tick` e `android` non dipendono l'uno dall'altro in modo circolare:
# possono essere costruiti insieme invece che in fila.
org.gradle.parallel=true

# Salta i moduli che non sono cambiati. Con tre moduli il guadagno e' piccolo ma gratis.
org.gradle.caching=true

# AndroidX invece delle librerie di supporto: e' l'unica opzione da anni, e senza questa
# riga il plugin Android si ferma con un errore invece di dedurlo.
android.useAndroidX=true
