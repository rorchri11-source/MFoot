[versions]
kotlin = "2.4.10"
agp = "9.3.1"
composeBom = "2026.08.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.0"
postgresql = "42.7.4"

# Firebase, solo per le notifiche push. Vedi `MFootMessaging` e `PushRepository`.
#
# La BOM decide da sola le versioni delle librerie Firebase: dichiararle a mano e' il modo
# piu' rapido di ritrovarsi due pezzi dello stesso SDK a versioni incompatibili.
firebaseBom = "34.18.0"
googleServices = "4.5.0"

# Firebase si porta dietro fragment 1.1.0, del 2019, che ha un difetto noto sulle risposte
# ai permessi: non chiama super.onRequestPermissionsResult e usa codici non validi. Il
# progetto non usa i Fragment, ma la versione sulla classpath conta lo stesso.
fragment = "1.8.5"

# minSdk 26 e' il minimo per java.time senza desugaring, che core usa ovunque
# per le date del calendario.
minSdk = "26"
# 37 e non 36: la Compose BOM di agosto 2026 richiede di compilare contro android-37.
targetSdk = "37"
compileSdk = "37"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }

postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
# Senza versione: la decide la BOM qui sopra.
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
